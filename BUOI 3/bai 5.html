<body>
    <h2>Định dạng văn bản</h2>
    <p><b><u>Hóa học:</u></b> <i>Nước</i>: <font color="red">H<sub>2</sub>0</font>; <i>Axit Sunfuric</i>: <span style="color:red">H<sub>2</sub>SO<sub>4</sub></span></p>
    <p><b><u>Toán học:</u></b> <i>Phương trình bậc 2</i>: <font color="red">ax<sup>2</sup>+ bx + c = 0</font></p>
    <p><b><u>Tin học:</u></b> <i>Vòng lặp trong For:</i></p>
    <pre style="color: #00c; background-color: #ccc">
         For i = 0 To 10
              Tong = Tong = i
         Next
     </pre>
